name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
    - run: pip install build
    - run: python -m build
    - uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/