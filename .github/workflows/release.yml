name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install build packaging

      - name: Validate version
        id: version
        run: |
          branch_version=${GITHUB_HEAD_REF#'release/'}
          toml_version=$(python -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          [ "$toml_version" = "$branch_version" ] || exit 1
          echo "version_tag=v${branch_version}" >> $GITHUB_OUTPUT
      - run: python -m build

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: Release ${{ steps.version.outputs.version_tag }}
          generate_release_notes: true

      - uses: pypa/gh-action-pypi-publish@release/v1
