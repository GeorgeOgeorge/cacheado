name: Publish to PyPI

on:
  push:
    branches: [ master, main ]
  pull_request:
    types: [ opened, synchronize, closed ]
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-checks:
    name: CI Checks (Python ${{ matrix.python-version }})

    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: make test-coverage

    - name: Run quality checks
      run: make quality-check

  publish-to-pypi:
    name: Publish to PyPI
    
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
      id-token: write 
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install build tools
      run: python -m pip install --upgrade pip build packaging
    
    - name: Validate version from branch and toml
      id: version_check
      run: |
        branch_name=${{ github.event.pull_request.head.ref }}
        branch_version=${branch_name#'release/'}
        echo "Version from branch: $branch_version"

        toml_version=$(python -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
        echo "Version from pyproject.toml: $toml_version"
        
        if [ "$toml_version" != "$branch_version" ]; then
          echo "Error: Version in pyproject.toml ($toml_version) does not match branch ($branch_version)!"
          exit 1
        fi
        
        latest_tag=$(git tag --sort=-version:refname | head -n1 || echo "")
        echo "Latest tag: $latest_tag"
        
        if [ -n "$latest_tag" ]; then
          python -c "
        from packaging import version
        import sys
        current = version.parse('$branch_version')
        latest = version.parse('$latest_tag.lstrip('v')')
        if current <= latest:
            print(f'Error: Current version {current} must be greater than latest {latest}')
            sys.exit(1)
        print(f'Version validation passed: {current} > {latest}')
        "
        fi
        
        echo "version_tag=v${branch_version}" >> $GITHUB_OUTPUT
        
    - name: Build package
      run: python -m build
    
    - name: Create GitHub Release (and Tag)
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version_check.outputs.version_tag }}
        name: Release ${{ steps.version_check.outputs.version_tag }}
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
